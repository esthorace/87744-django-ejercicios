{% extends "core/base.html" %}

{% block style %}
    <style>
        .tabla-categorias {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .tabla-categorias th,
        .tabla-categorias td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .tabla-categorias th {
            background: var(--surface-soft);
            font-size: .82rem;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--muted);
        }

        .tabla-categorias tr:last-child td {
            border-bottom: 0;
        }

        .acciones {
            display: flex;
            gap: 10px;
        }

        td.acciones {
            display: flex;
            align-items: center;
        }

        .accion-icono {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: white;
            color: var(--primary);
            transition: background .2s ease, color .2s ease;
        }

        .accion-icono:hover {
            background: var(--primary);
            color: white;
        }

        .accion-icono svg {
            width: 16px;
            height: 16px;
        }

        .accion-icono--eliminar {
            color: #b3452f;
        }

        .accion-icono--eliminar:hover {
            background: #b3452f;
            color: white;
        }
    </style>
{% endblock style %}

{% block content %}
    <h1>Categoría de Servicios - Lista</h1>
    <p><a href="{% url 'servicio:categoriaservicio_create' %}">Crear</a></p>
    <table class="tabla-categorias">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for categoria in categorias %}
                <tr>
                    <td>{{ categoria.nombre }}</td>
                    <td class="acciones">
                        <a class="accion-icono"
                           href="{% url 'servicio:categoriaservicio_detail' categoria.pk %}"
                           title="Ver"
                           aria-label="Ver">
                            <svg viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </a>
                        <a class="accion-icono" href="#" title="Editar" aria-label="Editar">
                            <svg viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">
                                <path d="M12 20h9"></path>
                                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"></path>
                            </svg>
                        </a>
                        <a class="accion-icono accion-icono--eliminar"
                           href="#"
                           title="Eliminar"
                           aria-label="Eliminar">
                            <svg viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">
                                <path d="M3 6h18"></path>
                                <path d="M8 6V4h8v2"></path>
                                <path d="M19 6l-1 14H6L5 6"></path>
                                <path d="M10 11v6M14 11v6"></path>
                            </svg>
                        </a>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="2">No hay categorías registradas.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    <p><a href="{% url 'servicio:home' %}">Volver</a></p>
{% endblock content %}
