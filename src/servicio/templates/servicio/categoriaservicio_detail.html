{% extends "core/base.html" %}
{% load static %}

{% block style %}
    <link rel="stylesheet" href="{% static 'core/detail.css' %}" />
{% endblock style %}

{% block content %}
    <div class="container page">
        <div class="page-header">
            <div>
                <p class="page-eyebrow">Categorías · Detalle</p>
                <h1>{{ categoria.nombre }}</h1>
            </div>
            <div class="page-actions">
                <a class="btn btn-light" href="{% url 'servicio:categoriaservicio_update' categoria.pk %}">Editar</a>
                <a class="btn btn-ghost" href="{% url 'servicio:categoriaservicio_list' %}">← Volver</a>
            </div>
        </div>
        <div class="detalle-categoria">
            <dl>
                <div>
                    <dt>Nombre</dt>
                    <dd>{{ categoria.nombre }}</dd>
                </div>
                <div class="full">
                    <dt>Descripción</dt>
                    <dd>{{ categoria.descripcion|default:"—" }}</dd>
                </div>
            </dl>
        </div>
    </div>
{% endblock content %}
