{% extends "core/base.html" %}
{% load static %}

{% block style %}
    <link rel="stylesheet" href="{% static 'core/form.css' %}" />
{% endblock style %}

{% block content %}
    <h1>Cliente - Eliminar</h1>
    <div class="confirmar-eliminar">
        <p>¿Seguro que deseas eliminar al cliente <strong>{{ cliente }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Eliminar</button>
        </form>
    </div>
    <p><a href="{% url 'servicio:cliente_list' %}">Cancelar</a></p>
{% endblock content %}
